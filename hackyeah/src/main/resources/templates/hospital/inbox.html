<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${hospital.name})}"></head>
<body>
<header th:replace="~{layout :: header('hospital')}"></header>
<main class="page">
    <div th:replace="~{layout :: flash}"></div>

    <h1 th:text="${hospital.name}">Szpital</h1>
    <p class="muted">
        <span th:text="${hospital.district}">Dzielnica</span> ·
        dyżurny <span th:text="${hospital.dutyPhone}">+48</span>
    </p>

    <div class="grid-2">
        <section class="card">
            <h2>Obłożenie</h2>
            <p class="big" th:classappend="'level-' + ${#strings.toLowerCase(hospital.occupancyLevel())}">
                <span th:text="${hospital.occupancyPercent()} + '%'">80%</span>
            </p>
            <p class="muted" th:text="${hospital.occupiedBeds + ' / ' + hospital.totalBeds + ' łóżek zajętych'}">80 / 100</p>

            <h3>Specjalności</h3>
            <ul class="tags">
                <li th:each="s : ${hospital.specialties}" th:text="#{'specialty.' + ${s}}">Neurologia</li>
            </ul>
            <h3>Procedury i sprzęt</h3>
            <ul class="tags">
                <li th:each="p : ${hospital.procedures}" th:text="#{'procedure.' + ${p}}">TK</li>
            </ul>
        </section>

        <section class="card">
            <h2>Aktywne flagi</h2>
            <ul class="flags" th:unless="${#lists.isEmpty(hospital.flags)}">
                <li th:each="f : ${hospital.flags}">
                    <strong th:text="#{'flag.' + ${f.type}}">Flaga</strong>
                    <span class="muted" th:text="'do ' + ${#temporals.format(f.validUntil, 'HH:mm')}">do 14:00</span>
                </li>
            </ul>
            <p class="muted" th:if="${#lists.isEmpty(hospital.flags)}">Brak aktywnych flag.</p>
        </section>
    </div>

    <section class="card placeholder">
        Skrzynka zapytań i decyzje „przyjmuję / odmawiam” pojawią się w etapie 2.
    </section>
</main>
</body>
</html>
