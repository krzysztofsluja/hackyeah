spring.application.name=hackyeah
server.port=8090

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8
app.travel.rush-hour-multiplier=1.5

# Demo UI (in-memory mock backend): wave size, wave timeout per urgency, manual flag lifetime
demo.wave-size=3
demo.wave-timeout.time-critical=30s
demo.wave-timeout.urgent-stable=45s
demo.wave-timeout.planned=60s
demo.flag-duration=2h
