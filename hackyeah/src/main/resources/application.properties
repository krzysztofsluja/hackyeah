spring.application.name=hackyeah
server.port=8090

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8
app.travel.rush-hour-multiplier=1.5

# Wave dispatch: top N first, next N once the wave closes. Timeouts are divided by time-scale,
# so the demo can show escalation in seconds instead of minutes.
app.waves.size=3
app.waves.timeout.time-critical=PT3M
app.waves.timeout.urgent-stable=PT5M
app.waves.timeout.planned=PT10M
app.waves.time-scale=1
app.waves.sweep-interval-ms=2000
