spring.application.name=hackyeah
server.port=8090

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8
app.travel.rush-hour-multiplier=1.5

# Wave dispatch: top N first, next N once the wave closes. Timeouts are divided by time-scale,
# so the demo can show escalation in seconds instead of minutes (6 -> 30 s / 50 s / 100 s).
app.waves.size=3
app.waves.timeout.time-critical=PT3M
app.waves.timeout.urgent-stable=PT5M
app.waves.timeout.planned=PT10M
app.waves.time-scale=6
app.waves.sweep-interval-ms=1000

# Demo UI: the hospital the referring doctor works in, and how long a manual flag lives
demo.origin-hospital-id=1
demo.flag-duration=2h
# Scenario: the closest stroke centre (Wojewódzki, id 2) is overloaded and its cath lab is busy,
# so a thrombectomy referral has to go elsewhere. Restored by every demo reset.
demo.scenario-flags.2=CATH_LAB_BUSY
# ADT stand-in nudging occupancy every 5 s; "-" switches it off
demo.occupancy-simulation-cron=*/5 * * * * *
