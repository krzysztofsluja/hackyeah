# data.sql is demo seed data - loading it into the test context would collide with the
# hospitals and travel-time rows the tests insert themselves.
spring.sql.init.mode=never

app.waves.size=3
app.waves.timeout.time-critical=PT3M
app.waves.timeout.urgent-stable=PT5M
app.waves.timeout.planned=PT10M
app.waves.time-scale=1
